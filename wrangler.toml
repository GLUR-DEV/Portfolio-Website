# Cloudflare Worker (with static assets) configuration for glursolutions.com

# IMPORTANT: this must match the name of your Worker in the Cloudflare dashboard
# (Workers & Pages > click your project > the name at the top). If it differs, change it here.
name = "portfolio-website"

main = "src/worker.js"                  # server code (the contact form endpoint)
compatibility_date = "2026-10-01"

[assets]
directory = "./public"                  # the website files; only this folder is public
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/Admin", "/Admin/*"]   # /api/... and the admin proxy run worker.js; everything else is served as files

[[d1_databases]]
binding = "DB"                          # how the code refers to it: env.DB
database_name = "glur-db"
database_id = "37f35d65-1d1d-4791-8525-4940048743e5"  # printed by: npx wrangler d1 create glur-db (not a secret)

# Email alerts. ALERT_FROM must be an address on a domain set up in Cloudflare Email Service/Routing;
# ALERT_TO must be a verified destination address there. The binding below is locked to that one address.
[vars]
ALERT_TO = "glur.studios@gmail.com"
ALERT_FROM = "contact@glursolutions.com"

# Where the saved JSON copy of the site content lives (written by the admin app on every save). The Worker reads
# it server-side, so the database is never touched by visitors. Needs public read on the container, or change
# the Worker to send a read key.
SNAPSHOT_BASE = "https://glurstorage.blob.core.windows.net/snapshots"

# The hosted ASP.NET admin app. Only used to forward /admin (src/adminProxy.js); no content is fetched from it.
# The matching secret is set with: npx wrangler secret put ADMIN_ORIGIN_SECRET
API_ORIGIN = "https://glursolutions-dtc3addjc8ajcpd2.australiaeast-01.azurewebsites.net"

[[send_email]]
name = "EMAIL"
destination_address = "glur.studios@gmail.com"

[observability]
enabled = true                          # lets you see errors/logs in the dashboard
